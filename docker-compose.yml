services:
  healthsync:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./credentials:/app/credentials   # token.json (refreshed in place)
      - ./data:/app/data                 # health.db
      - ./reports:/app/reports           # weekly PDFs
    ports:
      - "127.0.0.1:18787:18787"            # point the Cloudflare tunnel at http://localhost:18787
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18787/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
